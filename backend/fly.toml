# Fly.io config for Burhani Traders backend
# 1. Create a volume: fly volumes create data --size 1 --region <your-region>
# 2. Set secrets: fly secrets set JWT_SECRET=xxx ADMIN_PASSWORD=xxx FRONTEND_URL=https://burhanitradersctg.vercel.app
# 3. Deploy: fly deploy

app = "burhanitraders-backend"

[build]

[env]
  PORT = "8080"
  DATA_PATH = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "data"
  destination = "/data"
